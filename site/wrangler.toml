name = "buitenzorg-lemongrass"
# Deploys go to the "Arga and Matt" Cloudflare account. Its id is set as CLOUDFLARE_ACCOUNT_ID in site/.env (not committed).
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"
# Set in the Cloudflare dashboard (Pages project → Settings → Variables), not here:
#   RESEND_API_KEY, INQUIRY_TO, INQUIRY_FROM
# Optional KV binding for a durable copy of inquiries: INQUIRIES

[[d1_databases]]
binding = "DB"
database_name = "buitenzorg-orders"
database_id = "87013e7c-9c98-471c-aa36-ba25cb1ec7dd"

[vars]
# Cloudflare Access application protecting /admin and /api/admin (not secret: the AUD is public in every Access JWT)
ACCESS_TEAM = "argamatt"
ACCESS_AUD = "4bc9dbea59dea6391da634fa25e4dd2ddf16696ba53414232ebd4e6df5734aaf"
